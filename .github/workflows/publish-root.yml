name: Publish root verification site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: root-verification-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static publication
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml naver*.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          name: root-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: root-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public ownership files
        run: |
          python - <<'PY'
          from pathlib import Path
          import urllib.request,time
          for file in sorted(Path('.').glob('naver*.html')):
              expected=file.read_text().strip()
              for attempt in range(10):
                  try:
                      with urllib.request.urlopen('https://a62992063-afk.github.io/'+file.name,timeout=20) as response:
                          actual=response.read().decode().strip()
                      assert actual==expected
                      break
                  except Exception:
                      if attempt==9:raise
                      time.sleep(3)
              print('NAVER_PUBLIC_FILE_VERIFIED',file.name)
          PY
