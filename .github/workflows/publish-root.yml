name: Publish root verification site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: root-verification-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static publication
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml naverbc2e135e1e34c515e6dfe4e8d536a20f.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Clear the initial deployment reported as blocking publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/a62992063-afk/a62992063-afk.github.io/pages/deployments/b1e2540de7b4ffe23e82fe140f3839f32e88f778/cancel
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public ownership file
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-all-errors https://a62992063-afk.github.io/naverbc2e135e1e34c515e6dfe4e8d536a20f.html -o /tmp/verification.html
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/verification.html').read_text().strip()
          assert text=='naver-site-verification: naverbc2e135e1e34c515e6dfe4e8d536a20f.html',text
          print('NAVER_PUBLIC_FILE_VERIFIED')
          PY
